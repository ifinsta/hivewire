name: fleet-smoke

on:
  pull_request:
    paths:
      - "fleet/**"
      - "tests/test_fleet.py"
      - ".github/workflows/fleet-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hwp1:
    name: HWP/1 mTLS and Git handoff
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint new fleet modules
        run: |
          python -m pip install --quiet ruff
          python -m ruff check fleet tests/test_fleet.py
      - name: Execute network and Git integration acceptance
        run: python -m unittest discover -s tests -p "test_fleet.py" -v
